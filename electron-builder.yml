appId: com.alimunozadvisory.alisuite
productName: Alisuite
copyright: Ali Muñoz Advisory
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.ffmpeg-x64,.impeccable,.github,.claude,scripts,services,workers}/**'
asarUnpack:
  - resources/**
  # Módulo nativo de SQLite: tiene que quedar fuera del .asar.
  - node_modules/better-sqlite3/**
  # Binario de ffmpeg para extraer el audio de las grabaciones.
  - node_modules/ffmpeg-static/**
  # Teclado global (detectar cuándo se suelta el atajo de nota de voz).
  - node_modules/uiohook-napi/**
afterPack: build/after-pack.cjs
protocols:
  - name: Alisuite
    schemes:
      - daylios
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # App de menubar: sin icono en el Dock desde el arranque.
    LSUIElement: true
    NSMicrophoneUsageDescription: Alisuite graba el micrófono durante las reuniones que tú inicias.
    NSAudioCaptureUsageDescription: Alisuite graba el audio del sistema durante las reuniones que tú inicias.
  notarize: true
dmg:
  artifactName: Alisuite-${version}-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Alisuite
  uninstallDisplayName: Alisuite
  artifactName: Alisuite-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: varmiguemunoz
  repo: daylios
  releaseType: draft
# better-sqlite3 es nativo: se recompila para la versión de Electron al empaquetar.
npmRebuild: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
